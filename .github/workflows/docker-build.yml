name: Build the image

on:
  workflow_dispatch
  # push:
  #   branches:
  #     - main
  #     - feature-login

jobs:
  Build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Repo
        uses: actions/checkout@v6

      - name: Setup Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Get Short commit SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the image and push to registry
        uses: docker/build-push-action@v7
        with:
          context: ./flask-app-ecs
          file: ./flask-app-ecs/Dockerfile.multistage
          push: ${{ github.ref == 'refs/heads/main'}}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flask-app:latest
            ${{ secrets.DOCKER_USERNAME }}/flask-app:sha-${{ steps.vars.outputs.sha }}
