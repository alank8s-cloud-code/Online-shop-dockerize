name: Build and push Image

on:
  push:
    branches:
      - main

jobs:
  Build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Repo
        uses: actions/checkout@v6

      - name: Lint dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.multistage

      - name: Setup Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Get Short commit SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the image and push to registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.multistage
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/online-shopping:latest
            ${{ secrets.DOCKER_USERNAME }}/online-shopping:sha-${{ steps.vars.outputs.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/online-shopping:latest
          format: "table"
          version: "v0.74.0"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
